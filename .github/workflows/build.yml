name: Build Dotline Launcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Dotline.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dotline-APK
          path: Dotline.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Dotline Launcher v1.0.${{ github.run_number }}
          body: |
            ### Dotline Launcher (Nothing OS 5.0 Recreation)
            - Dot-matrix Canvas Clock, Date & Battery
            - Procedural Wallpaper Studio
            - Synthesizer Sound Studio (AudioTrack PCM)
            - Monochrome icon silhouette engine + 60+ vector glyphs
            - Built-in AppWidgetProviders for Samsung One UI
            - One UI Setup Guide & deep links
          files: Dotline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
